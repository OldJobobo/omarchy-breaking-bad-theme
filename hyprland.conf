# This file is not a full hyprland configuration.
# It is intended to be included in your main hyprland.conf.

$activeBorderColor = rgb(52ada8)
$inactiveBorderColor = rgb(2c5b34)

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
    border_size = 2
    gaps_in = 4
    gaps_out = 8
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
}

decoration {
    rounding = 0

    blur {
        enabled = true
        size = 5
        passes = 2
        noise = 0.015
        contrast = 1.0
        brightness = 0.85
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000099)
        offset = 0 4
    }
}

animations {
    enabled = true

    bezier = snap, 0.25, 0.1, 0.25, 1.0

    animation = windows, 1, 3, snap
    animation = windowsOut, 1, 3, snap, slide
    animation = fade, 1, 3, snap
    animation = workspaces, 1, 4, snap
}


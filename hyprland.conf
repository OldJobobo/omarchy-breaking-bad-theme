# hyprland.conf
# By OldJobobo (https://github.com/OldJobobo)
#
# This file is not a full hyprland configuration.
# It is intended to be included in your main hyprland.conf.

$activeBorderColor   = rgba(52ada8ee) rgba(2c5b34ee) rgba(52ada8ee) 45deg
$inactiveBorderColor = rgba(2c5b3455)

general {
    col.active_border   = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
    border_size = 2
    gaps_in  = 4
    gaps_out = 8
}

group {
    col.border_active   = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
}

decoration {
    rounding = 0

    dim_inactive     = true
    dim_strength     = 0.15
    active_opacity   = 1.0
    inactive_opacity = 0.95

    blur {
        enabled            = true
        size               = 5
        passes             = 3
        noise              = 0.02
        contrast           = 1.12
        brightness         = 0.86
        vibrancy           = 0.18
        vibrancy_darkness  = 0.72
        ignore_opacity     = true
        new_optimizations  = true
        xray               = false
        popups             = true
        popups_ignorealpha = 0.60
    }

    shadow {
        enabled        = true
        range          = 20
        render_power   = 3
        color          = rgba(00000099)
        color_inactive = rgba(0000004d)
        offset         = 2 4
        ignore_window  = true
    }
}

animations {
    enabled = true

    bezier = labEase, 0.4, 0, 0.2, 1

    animation = borderangle, 1, 20, labEase, once
    animation = windows,     1, 3,  labEase, slide
    animation = windowsIn,   1, 3,  labEase, slide
    animation = windowsOut,  1, 3,  labEase, slide
    animation = fade,        1, 3,  labEase
    animation = workspaces,  1, 4,  labEase, slide
}

windowrulev2 = noblur, class:^(walker)$
windowrulev2 = noblur, class:^(swayosd)$
windowrulev2 = opacity 1.0 override, fullscreen:1


# Breaking Bad for Omarchy Quattro
# IBM Carbon's layered, square-edged interface language translated into the
# lab palette: void -> panel -> instrument, with teal focus rails and scarce
# orange synthesis signals.

[bar]
background       = "#011d1f"
background-alpha = 0.985
text             = "#ffe26a"
active           = "#e32535"
scale-with-font  = true
size-horizontal  = 28
size-vertical    = 28

[hyprland]
active-border            = "rgba(52ada8ee) rgba(2c5b34ee) rgba(52ada8ee) 45deg"
active-border-foreground = "rgba(ffe26aee) rgba(52ada8ee) 45deg"
active-border-width      = 1

[controls]
# Carbon controls are quiet at rest, gain a teal wash on interaction, and use
# a single left rail for hover, keyboard focus, and persistent selection.
normal-color             = "#b8a850"
normal-fill-alpha        = 0.03
normal-border            = "#2c5b34"
normal-border-width      = 1
normal-border-alpha      = 0.72

hover-cursor-color             = "#52ada8"
hover-cursor-fill-alpha        = 0.12
hover-cursor-border            = "#52ada8"
hover-cursor-border-width      = "0 0 0 3"
hover-cursor-border-alpha      = 0.92

focus-color             = "#52ada8"
focus-fill-alpha        = 0.16
focus-border            = "#52ada8"
focus-border-width      = "0 0 0 3"
focus-border-alpha      = 1.0

selected-color             = "#52ada8"
selected-fill-alpha        = 0.18
selected-border            = "#52ada8"
selected-border-width      = "0 0 0 3"
selected-border-alpha      = 1.0

pressed-color          = "#f8c120"
pressed-fill-alpha     = 0.22
selection-color        = "#52ada8"
selection-fill-alpha   = 0.30

[spacing]
# Carbon's compact 8px grid, with 4px reserved for micro-spacing.
scale                    = 1.0
scale-with-font          = true
xxs                      = 4
xs                       = 4
sm                       = 4
md                       = 8
lg                       = 8
xl                       = 12
xxl                      = 16
xxxl                     = 16
huge                     = 24
control-gap              = 8
control-padding-x        = 12
control-padding-y        = 8
input-padding-y          = 8
control-height           = 32
popup-row-height         = 32
row-gap                  = 8
row-padding-x            = 12
label-gap                = 4
panel-gap                = 16
panel-padding            = 20
popup-padding            = 16
dropdown-width           = 240
searchable-dropdown-width = 264
number-field-width       = 120
searchable-popup-min-height = 224

[font]
# The shell follows Omarchy's active monospace family; this scale keeps the
# Carbon hierarchy deliberate even when IBM Plex is not installed.
base-size     = 12
caption       = 10
body-small    = 11
body          = 12
subtitle      = 13
title         = 14
heading       = 16
display       = 24
display-large = 28
icon-small    = 11
icon          = 14
icon-large    = 18

[popups]
background       = "#031e20"
background-alpha = 0.985
text             = "#ffe26a"
border           = "hyprland.active-border"
border-alpha     = 0.82
border-width     = 1

[tooltip]
background       = "#011d1f"
background-alpha = 0.985
text             = "#b8a850"
border           = "#2c5b34"
border-alpha     = 0.86
border-width     = 1

[notifications]
# Orange is the synthesis signal: reserved for dispatched information.
background       = "#031e20"
background-alpha = 0.985
text             = "#ffe26a"
border           = "#e8872e"
border-alpha     = 1.0
border-width     = 2
countdown        = "#f8c120"

[launcher]
background                = "#031e20"
background-alpha          = 0.985
text                      = "#b8a850"
border                    = "hyprland.active-border"
border-alpha              = 0.82
border-width              = 1
scrim                     = "#011819"
scrim-alpha               = 0.72
selected-background       = "#0a2e30"
selected-background-alpha = 1.0
selected-text             = "#ffe26a"
selected-border           = "#52ada8"
selected-border-alpha     = 1.0
selected-border-width     = "0 0 0 3"

[menu]
background                = "#031e20"
background-alpha          = 0.985
text                      = "#b8a850"
border                    = "hyprland.active-border"
border-alpha              = 0.82
border-width              = 1
scrim                     = "#011819"
scrim-alpha               = 0.72
selected-background       = "#0a2e30"
selected-background-alpha = 1.0
selected-text             = "#ffe26a"
selected-border           = "#52ada8"
selected-border-alpha     = 1.0
selected-border-width     = "0 0 0 3"

[polkit]
background         = "#031e20"
background-alpha   = 0.995
text               = "#ffe26a"
text-error         = "#e32535"
border             = "hyprland.active-border"
border-error       = "#e32535"
border-alpha       = 0.92
border-width       = 1
border-error-width = 2
scrim              = "#011819"
scrim-alpha        = 0.76
accent             = "#52ada8"

[lock]
# Orange marks the sealed idle state; teal takes over while authenticating.
background          = "#011d1f"
background-alpha    = 0.985
text                = "#ffe26a"
placeholder         = "#b8a850"
text-error          = "#e32535"
border              = "#e8872e"
border-active       = "hyprland.active-border"
border-error        = "#e32535"
border-alpha        = 1.0
border-width        = 2
border-active-width = 2
border-error-width  = 2
selection           = "#52ada8"
selection-alpha     = 0.42

[image-picker]
scrim                    = "#011819"
scrim-alpha              = 0.72
text                     = "#ffe26a"
selected-border         = "#52ada8"
selected-border-alpha   = 1.0
unselected-border       = "#2c5b34"
unselected-border-alpha = 0.68
